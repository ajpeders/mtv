server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # page, player JS, manifest: browsers must revalidate every load, or a
    # phone keeps running a stale player for days (bit us 2026-08-29)
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # the channel lineup is runtime state (admin page edits it), not repo
    # content — served from the mounted config dir
    location = /channels.json {
        alias /config/channels.json;
        add_header Cache-Control "no-cache";
    }

    # the videos themselves never change for a given id — cache hard
    location /videos/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # admin proxy for the standalone deploy (nginx.admin.conf); drop this
    # include when an external reverse proxy fronts /admin instead
    include /etc/nginx/mtv.d/*.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
