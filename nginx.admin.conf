# Standalone deploy only (docker-compose.standalone.yml): there's no Traefik,
# so the player's nginx proxies /admin to the admin app. NO AUTH — keep the
# published port on your LAN or behind your own authenticating proxy.
location ^~ /admin {
    # resolve per request, so a restarted admin container is found again
    resolver 127.0.0.11 valid=10s;
    set $admin http://mtv-admin:8000;
    proxy_pass $admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
